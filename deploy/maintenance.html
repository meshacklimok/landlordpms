<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back soon - NyumbaPMS</title>
<style>
  :root { --bg: #f7f8fa; --fg: #1b2330; --muted: #5b6676; --card: #fff; --line: #dde2ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161d; --fg: #e8ecf2; --muted: #9aa5b5; --card: #1a212b; --line: #2b3441; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
  main { max-width: 30rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 2rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { margin: .5rem 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>We are updating NyumbaPMS</h1>
  <p>This takes a few minutes. Your records and payments are safe.</p>
  <p>If a tenant paid by M-Pesa just now, the payment will show as soon as we are back. Please try again in about 10 minutes.</p>
</main>
</body>
</html>

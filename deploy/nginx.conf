# NyumbaPMS behind nginx (D-122, doc 21). Installed by deploy/setup.sh as /etc/nginx/sites-available/landlordpms,
# with DOMAIN replaced. certbot then adds the https server and the redirect from http.
# Uploaded files (media/) are never served here: the app checks who may see them and sends them itself.

# Edge limits and cheap defences (D-139). These sit in the http block via sites-enabled, so they apply to the app only.
limit_req_zone $binary_remote_addr zone=nyumba_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nyumba_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=nyumba_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Any other name, or the bare IP: close the connection, so scanners never reach Django.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    server_tokens off;

    # Slow-connection attacks: a client that dribbles its request is dropped.
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 30s;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    limit_conn nyumba_conn 30;

    # Only the methods the app uses.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

    # Probes for files and software we do not run are closed without reaching Django.
    location ~* /\.(?!well-known/) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|sql|bak|ini|log|yml|yaml|toml)$ { return 444; }
    location ~* ^/(wp-admin|wp-login|wp-content|xmlrpc|phpmyadmin|cgi-bin|vendor|actuator|admin/?$) { return 444; }

    # Uploads are up to 10 MB each (documents, inspection photos); a form may carry a few.
    client_max_body_size 25m;

    location /static/ {
        alias /srv/landlordpms/staticfiles/;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    # Sign-in, codes and password resets: 10 a minute per address, with a small burst (the app also limits per
    # account and per number). Paths follow accounts/urls.py, portal/urls.py and owner_portal/urls.py.
    location ~ ^/(login|register|verify-phone|verify-email|password-reset|invite|my/invite|owner/invite|ok-ml-staff) {
        limit_req zone=nyumba_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=nyumba_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # One proxy: TRUSTED_PROXY_COUNT=1 reads the address nginx appends here (core/net.py).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

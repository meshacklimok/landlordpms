# NyumbaPMS behind nginx (D-122, doc 21). Installed by deploy/setup.sh as /etc/nginx/sites-available/landlordpms,
# with DOMAIN replaced. certbot then adds the https server and the redirect from http.
# Uploaded files (media/) are never served here: the app checks who may see them and sends them itself.

# Edge limits and cheap defences (D-139). These sit in the http block via sites-enabled, so they apply to the app only.
limit_req_zone $binary_remote_addr zone=nyumba_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nyumba_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=nyumba_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Screens drawn by Next.js (D-168) listen on 3000; Django is on 8000. Only the paths in the regex below go to Next.js, so
# webhooks, USSD, static files and sign-in keep the short path to Django and TRUSTED_PROXY_COUNT stays 1.
# When a screen moves to web/src/app, add its path to the regex in the "Screens Next.js draws" location below.

# Any other name, or the bare IP: close the connection, so scanners never reach Django.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# The bare domain and www go to the app's own address, so there is one site, one login cookie and one CSRF origin.
# certbot adds the https side of this block too, as long as these names are on the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name ALIASES;
    server_tokens off;
    return 301 https://DOMAIN$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    server_tokens off;

    # Slow-connection attacks: a client that dribbles its request is dropped.
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 30s;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    limit_conn nyumba_conn 30;

    # Maintenance mode (doc 26). `bash deploy/maintenance.sh on` creates the flag file and every request gets a plain
    # "back soon" page with status 503 (M-Pesa and Paystack see 503 and retry later). `off` removes the file.
    error_page 503 @maintenance;
    location @maintenance {
        root /srv/landlordpms/deploy;
        rewrite ^ /maintenance.html break;
        add_header Retry-After 600 always;
    }
    if (-f /srv/landlordpms/maintenance.flag) { return 503; }

    # Only the methods the app uses.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

    # Probes for files and software we do not run are closed without reaching Django.
    location ~* /\.(?!well-known/) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|sql|bak|ini|log|yml|yaml|toml)$ { return 444; }
    location ~* ^/(wp-admin|wp-login|wp-content|xmlrpc|phpmyadmin|cgi-bin|vendor|actuator|admin/?$) { return 444; }

    # Uploads are up to 10 MB each (documents, inspection photos); a form may carry a few.
    client_max_body_size 25m;

    location /static/ {
        alias /srv/landlordpms/staticfiles/;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    # Sign-in, codes and password resets: 10 a minute per address, with a small burst (the app also limits per
    # account and per number). Paths follow accounts/urls.py, portal/urls.py and owner_portal/urls.py.
    location ~ ^/(login|register|verify-phone|verify-email|password-reset|invite|my/invite|owner/invite|ok-ml-staff) {
        limit_req zone=nyumba_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js assets (scripts, styles, fonts).
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        access_log off;
    }

    # Screens Next.js draws (keep in step with web/src/app). Record ids are UUIDs (public_id), not numbers. They read their data from Django as the signed-in member.
    location ~ ^/(ask/?|organization/?|bank/inbox/?|bank/import(/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(/columns)?)?/?|imports/switch/?|leases/pickups/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?|messages/announcements/new/?|properties/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/(rollover|rooms(/new)?|waitlist)/?|properties/rooms/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?|reports/hostel/?|console/control/notifications(/[A-Za-z0-9_.-]+)?/?)$ {
        limit_req zone=nyumba_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The signed-in home is a Next.js screen; a visitor with no session cookie still gets Django's front page (D-133).
    location = / {
        limit_req zone=nyumba_general burst=60 nodelay;
        set $home_upstream http://127.0.0.1:8000;
        if ($cookie_sessionid != "") { set $home_upstream http://127.0.0.1:3000; }
        proxy_pass $home_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Callbacks carry a secret token in the path (M-Pesa, Paystack, USSD): keep it out of the access log.
    location /hooks/ {
        access_log off;
        limit_req zone=nyumba_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=nyumba_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # One proxy: TRUSTED_PROXY_COUNT=1 reads the address nginx appends here (core/net.py).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

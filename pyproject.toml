[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db -q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

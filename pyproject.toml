[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db -q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "*/migrations/*"]

[tool.ruff.lint]
# S: flake8-bandit's security checks (D-107). Tests may assert, use made-up passwords and plain random numbers.
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "S603", "S607"]
"conftest.py" = ["S101", "S105", "S106"]
"tests/loadtest/**" = ["S311"]

{% if tx.status == "MATCHED" %}<span class="badge bg-success-subtle text-success-emphasis border border-success-subtle">{{ tx.get_status_display }}</span>
{% elif tx.status == "UNMATCHED" %}<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">{{ tx.get_status_display }}</span>
{% elif tx.status == "FLAGGED" %}<span class="badge bg-danger-subtle text-danger-emphasis border border-danger-subtle">{{ tx.get_status_display }}</span>
{% else %}<span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">{{ tx.get_status_display }}</span>{% endif %}

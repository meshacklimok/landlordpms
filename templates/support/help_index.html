{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "Help" %}{% endblock %}
{% block content %}
<h1 class="h4 mb-3">{% trans "Help" %}</h1>
<input type="search" class="form-control mb-3" id="help-filter" data-filter="#help-topics" placeholder="{% trans 'Search help topics' %}" aria-label="{% trans 'Search help topics' %}">
<div class="row g-3 mb-3" id="help-topics">
  {% for slug, title, summary in topics %}
  <div class="col-md-6" data-text="{{ title|lower }} {{ summary|lower }}"><a class="card shadow-sm h-100 text-decoration-none text-reset" href="{% url 'support:help_topic' slug %}"><div class="card-body">
    <h2 class="h6 mb-1">{{ title }}</h2><p class="small text-muted mb-0">{{ summary }}</p></div></a></div>
  {% endfor %}
</div>
{% include "support/_contact_box.html" %}
{% endblock %}

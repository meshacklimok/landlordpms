{% load i18n %}{% if not value %}<span class="badge text-bg-light border">{% trans "Not assessed" %}</span>{% elif value == "GOOD" %}<span class="badge text-bg-success">{{ label }}</span>{% elif value == "FAIR" %}<span class="badge text-bg-secondary">{{ label }}</span>{% elif value == "POOR" %}<span class="badge text-bg-warning">{{ label }}</span>{% elif value == "DAMAGED" or value == "MISSING" %}<span class="badge text-bg-danger">{{ label }}</span>{% else %}<span class="badge text-bg-light border">{{ label }}</span>{% endif %}

{% if req.priority == "EMERGENCY" %}<span class="badge text-bg-danger"><i class="bi bi-exclamation-triangle-fill"></i> {{ req.get_priority_display }}</span>{% elif req.priority == "HIGH" %}<span class="badge text-bg-warning">{{ req.get_priority_display }}</span>{% else %}<span class="badge text-bg-light border">{{ req.get_priority_display }}</span>{% endif %}

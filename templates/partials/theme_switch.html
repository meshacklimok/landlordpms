{% load i18n %}<div class="theme-switch" role="group" aria-labelledby="theme-label">
  <button type="button" data-theme-value="light" aria-pressed="false">{% trans "Light" %}</button>
  <button type="button" data-theme-value="dark" aria-pressed="false">{% trans "Dark" %}</button>
  <button type="button" data-theme-value="auto" aria-pressed="false">{% trans "System" %}</button>
</div>

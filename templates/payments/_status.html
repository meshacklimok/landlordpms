{% with s=payment.state %}<span class="badge fw-medium border {% if s == 'confirmed' %}bg-success-subtle text-success-emphasis border-success-subtle{% elif s == 'pending' %}bg-warning-subtle text-warning-emphasis border-warning-subtle{% elif s == 'rejected' %}bg-danger-subtle text-danger-emphasis border-danger-subtle{% else %}bg-secondary-subtle text-secondary-emphasis border-secondary-subtle{% endif %}">{{ payment.get_state_display }}</span>{% endwith %}

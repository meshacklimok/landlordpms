{% if seo.index %}
  <meta name="description" content="{{ seo.description }}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="{{ seo.canonical }}">
  <link rel="alternate" hreflang="{{ seo.lang }}" href="{{ seo.canonical }}">
  <meta property="og:type" content="{{ seo.kind }}">
  <meta property="og:site_name" content="{{ seo.site_name }}">
  <meta property="og:locale" content="{{ seo.locale }}">
  <meta property="og:title" content="{{ seo.title }}">
  <meta property="og:description" content="{{ seo.description }}">
  <meta property="og:url" content="{{ seo.canonical }}">
  <meta property="og:image" content="{{ seo.image }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ seo.title }}">
  <meta name="twitter:description" content="{{ seo.description }}">
  <meta name="twitter:image" content="{{ seo.image }}">
  {% if seo.google_verification %}<meta name="google-site-verification" content="{{ seo.google_verification }}">{% endif %}
  {% if seo.bing_verification %}<meta name="msvalidate.01" content="{{ seo.bing_verification }}">{% endif %}
  {% if seo.jsonld %}<script type="application/ld+json">{{ seo.jsonld|safe }}</script>{% endif %}
{% else %}
  <meta name="robots" content="noindex, nofollow">
{% endif %}
